name: Quality engine

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  shell-tools:
    name: Real shell QA
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-shell
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install independent toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bats shellcheck libcurl4 libdw1 libbinutils
          tools="$RUNNER_TEMP/quality-tools"
          mkdir -p "$tools"
          curl --fail --location --silent --show-error https://github.com/SimonKagstrom/kcov/releases/download/v42/kcov-amd64.tar.gz -o "$tools/kcov.tar.gz"
          printf '%s  %s\n' '78aa17a5f6d27a867cc0540b1550051591d350423a1a0ef98d63c9ce7cc10f9d' "$tools/kcov.tar.gz" | sha256sum --check
          tar -xzf "$tools/kcov.tar.gz" -C "$tools"
          printf '%s\n' "$tools/usr/local/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: node experiments/code-quality/real-shell.mjs

  distribution:
    name: Installed package and Docker API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-distribution
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run test:types
      - run: node experiments/code-quality/package-smoke.mjs
      - name: Build and exercise the non-root API container
        run: |
          docker build -t code-quality-candidate .
          repo="$RUNNER_TEMP/quality-repo"
          mkdir -p "$repo"
          chmod 755 "$repo"
          git -C "$repo" init -b main
          printf 'def answer():\n    return 42\n' > "$repo/a.py"
          git -C "$repo" add a.py
          git -C "$repo" -c user.name=Quality -c user.email=quality@example.invalid commit -m 'Original API fixture'
          docker run -d --name quality-api --memory=512m --cpus=1 -p 127.0.0.1:3000:3000 -v "$repo:/workspace:ro" code-quality-candidate
          trap 'docker logs quality-api; docker rm -f quality-api' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health; then break; fi
            printf 'Waiting for API (%s/30)\n' "$attempt"
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/health
          test "$(docker exec quality-api id -u)" != 0
          curl --fail --silent -H 'content-type: application/json' \
            --data '{"files":[{"path":"a.py","content":"def answer():\n    return 42\n"}]}' \
            http://127.0.0.1:3000/v1/analyze > /tmp/quality-api.json
          node -e "const r=require('/tmp/quality-api.json'); if(!r.passed || r.files.length!==1) process.exit(1)"
          curl --fail --silent -H 'content-type: application/json' \
            --data '{}' http://127.0.0.1:3000/v1/evolution > /tmp/quality-evolution.json
          node -e "const r=require('/tmp/quality-evolution.json'); if(r.commits.length!==1 || !r.current.some(e=>e.kind==='function')) process.exit(1)"
